name: release

on:
  push:
    tags:
      - 'core-v*'
      - 'cli-v*'
      - 'create-karin-v*'
      - 'web-v*'
      - 'sandbox-win32-x64-v*'
      - 'sandbox-win32-arm64-v*'
  workflow_dispatch:
    inputs:
      component:
        description: 要发布的组件
        required: true
        type: choice
        options:
          - core
          - cli
          - create-karin
          - web
          - sandbox-win32-x64
          - sandbox-win32-arm64
      version:
        description: 已存在 Tag 对应的 SemVer（例如 2.1.0-beta.0）
        required: true
        type: string
      dry_run:
        description: 仅构建、打包并上传 Action 产物，不发布 npm 或 GitHub Release
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.component }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.meta.outputs.component }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      package_path: ${{ steps.meta.outputs.package_path }}
      package_name: ${{ steps.meta.outputs.package_name }}
      npm_package: ${{ steps.meta.outputs.npm_package }}
      rust_target: ${{ steps.meta.outputs.rust_target }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: 解析发布目标
        id: meta
        shell: bash
        env:
          DISPATCH_COMPONENT: ${{ inputs.component }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            COMPONENT="$DISPATCH_COMPONENT"
            VERSION="$DISPATCH_VERSION"
            TAG="$COMPONENT-v$VERSION"
            DRY_RUN="$DISPATCH_DRY_RUN"
            if [[ "$DRY_RUN" == 'true' ]]; then
              CHECKOUT_REF="$GITHUB_SHA"
            else
              CHECKOUT_REF="$TAG"
            fi
          else
            TAG="$GITHUB_REF_NAME"
            CHECKOUT_REF="$TAG"
            DRY_RUN='false'
            case "$TAG" in
              sandbox-win32-arm64-v*) COMPONENT='sandbox-win32-arm64' ;;
              sandbox-win32-x64-v*) COMPONENT='sandbox-win32-x64' ;;
              create-karin-v*) COMPONENT='create-karin' ;;
              core-v*) COMPONENT='core' ;;
              cli-v*) COMPONENT='cli' ;;
              web-v*) COMPONENT='web' ;;
              *) echo "不支持的发布 Tag: $TAG"; exit 1 ;;
            esac
            VERSION="${TAG#"$COMPONENT-v"}"
          fi

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag 中的版本不是合法 SemVer: $VERSION"
            exit 1
          fi

          case "$COMPONENT" in
            core)
              PACKAGE_PATH='packages/core'
              PACKAGE_NAME='node-karin'
              NPM_PACKAGE='true'
              RUST_TARGET=''
              ;;
            cli)
              PACKAGE_PATH='packages/cli'
              PACKAGE_NAME='@karinjs/cli'
              NPM_PACKAGE='true'
              RUST_TARGET=''
              ;;
            create-karin)
              PACKAGE_PATH='packages/create-karin'
              PACKAGE_NAME='create-karin'
              NPM_PACKAGE='true'
              RUST_TARGET=''
              ;;
            web)
              PACKAGE_PATH='packages/web'
              PACKAGE_NAME='karin-webui'
              NPM_PACKAGE='false'
              RUST_TARGET=''
              ;;
            sandbox-win32-x64)
              PACKAGE_PATH='packages/sandbox-win32-x64'
              PACKAGE_NAME='@karinjs/sandbox-win32-x64'
              NPM_PACKAGE='true'
              RUST_TARGET='x86_64-pc-windows-msvc'
              ;;
            sandbox-win32-arm64)
              PACKAGE_PATH='packages/sandbox-win32-arm64'
              PACKAGE_NAME='@karinjs/sandbox-win32-arm64'
              NPM_PACKAGE='true'
              RUST_TARGET='aarch64-pc-windows-msvc'
              ;;
          esac

          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "npm_package=$NPM_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "rust_target=$RUST_TARGET" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: 校验 Tag 与包版本
        env:
          PACKAGE_PATH: ${{ steps.meta.outputs.package_path }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./$PACKAGE_PATH/package.json').version")
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "$PACKAGE_PATH/package.json 版本为 $PACKAGE_VERSION，与 Tag 版本 $RELEASE_VERSION 不一致"
            exit 1
          fi

  build-sandbox:
    runs-on: windows-latest
    needs: prepare
    if: ${{ startsWith(needs.prepare.outputs.component, 'sandbox-win32-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ needs.prepare.outputs.rust_target }}

      - name: 构建 Windows Sandbox Helper
        working-directory: ${{ needs.prepare.outputs.package_path }}
        run: cargo build --release --locked --target ${{ needs.prepare.outputs.rust_target }}

      - name: 准备 Windows Sandbox Helper
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ needs.prepare.outputs.package_path }}
          RUST_TARGET: ${{ needs.prepare.outputs.rust_target }}
        run: |
          New-Item -ItemType Directory -Force "$env:PACKAGE_PATH/bin"
          Copy-Item "$env:PACKAGE_PATH/target/$env:RUST_TARGET/release/karin-sandbox.exe" "$env:PACKAGE_PATH/bin/karin-sandbox.exe"

      - name: Authenticode 签名
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ needs.prepare.outputs.package_path }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE)) {
            if ($env:DRY_RUN -eq 'true') {
              Write-Warning 'dry-run 未配置签名证书，跳过 Authenticode 签名'
              exit 0
            }
            throw '缺少 WINDOWS_SIGNING_CERTIFICATE，拒绝发布未签名 Sandbox Helper'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'karin-sandbox-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe 不可用' }
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_SIGNING_PASSWORD "$env:PACKAGE_PATH/bin/karin-sandbox.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Sandbox Helper Authenticode 签名失败' }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: 生成 SHA256
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ needs.prepare.outputs.package_path }}
        run: |
          $hash = (Get-FileHash "$env:PACKAGE_PATH/bin/karin-sandbox.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$env:PACKAGE_PATH/bin/karin-sandbox.exe.sha256" "$hash  karin-sandbox.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.component }}
          path: ${{ needs.prepare.outputs.package_path }}/bin
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, build-sandbox]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build-sandbox.result == 'success' || needs.build-sandbox.result == 'skipped') }}
    outputs:
      npm_published: ${{ steps.npm_publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/download-artifact@v4
        if: ${{ startsWith(needs.prepare.outputs.component, 'sandbox-win32-') }}
        with:
          name: ${{ needs.prepare.outputs.component }}
          path: ${{ needs.prepare.outputs.package_path }}/bin

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: true

      - name: 构建全部包
        run: pnpm build

      - name: 准备并打包发布产物
        id: pack
        shell: bash
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          PACKAGE_PATH: ${{ needs.prepare.outputs.package_path }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-artifacts
          case "$COMPONENT" in
            core)
              cp README.md packages/core
              node scripts/prepare-npm-publish.mjs packages/core
              npm pack packages/core --pack-destination release-artifacts
              ASSET=$(find release-artifacts -maxdepth 1 -name 'node-karin-*.tgz' -print -quit)
              ;;
            cli)
              node scripts/prepare-npm-publish.mjs packages/cli
              npm pack packages/cli --pack-destination release-artifacts
              ASSET=$(find release-artifacts -maxdepth 1 -name 'karinjs-cli-*.tgz' -print -quit)
              ;;
            create-karin)
              node scripts/prepare-npm-publish.mjs packages/create-karin
              npm pack packages/create-karin --pack-destination release-artifacts
              ASSET=$(find release-artifacts -maxdepth 1 -name 'create-karin-*.tgz' -print -quit)
              ;;
            web)
              ASSET="release-artifacts/karin-webui-$RELEASE_VERSION.tgz"
              tar -czf "$ASSET" -C packages/core/dist/web .
              ;;
            sandbox-win32-x64)
              npm pack packages/sandbox-win32-x64 --pack-destination release-artifacts
              ASSET=$(find release-artifacts -maxdepth 1 -name 'karinjs-sandbox-win32-x64-*.tgz' -print -quit)
              ;;
            sandbox-win32-arm64)
              npm pack packages/sandbox-win32-arm64 --pack-destination release-artifacts
              ASSET=$(find release-artifacts -maxdepth 1 -name 'karinjs-sandbox-win32-arm64-*.tgz' -print -quit)
              ;;
          esac
          test -n "$ASSET" && test -f "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.component }}-${{ needs.prepare.outputs.version }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: 检查 npm 发布能力
        id: npm_auth
        if: ${{ needs.prepare.outputs.npm_package == 'true' && needs.prepare.outputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::未配置 NPM_TOKEN，跳过 npm 发布；GitHub Release 仍会继续'
          fi

      - name: 发布 npm 包
        id: npm_publish
        if: ${{ needs.prepare.outputs.npm_package == 'true' && needs.prepare.outputs.dry_run != 'true' && steps.npm_auth.outputs.available == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          if npm view "$PACKAGE_NAME@$RELEASE_VERSION" version --silent 2>/dev/null | grep -Fxq "$RELEASE_VERSION"; then
            echo "$PACKAGE_NAME@$RELEASE_VERSION 已发布，跳过重复发布"
            echo 'published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            NPM_TAG="${RELEASE_VERSION#*-}"
            NPM_TAG="${NPM_TAG%%.*}"
          else
            NPM_TAG='latest'
          fi
          npm publish "$PACKAGE_ASSET" --access public --provenance --tag "$NPM_TAG"
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: 创建或更新当前仓库 Release
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PACKAGE_ASSET: ${{ steps.pack.outputs.asset }}
          COMPONENT: ${{ needs.prepare.outputs.component }}
          PACKAGE_PATH: ${{ needs.prepare.outputs.package_path }}
        run: |
          ASSETS=("$PACKAGE_ASSET")
          if [[ "$COMPONENT" == sandbox-win32-* ]]; then
            ASSETS+=("$PACKAGE_PATH/bin/karin-sandbox.exe")
            ASSETS+=("$PACKAGE_PATH/bin/karin-sandbox.exe.sha256")
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

      - name: 生成 dry-run 摘要
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        env:
          COMPONENT: ${{ needs.prepare.outputs.component }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          echo '## Release dry-run 通过' >> "$GITHUB_STEP_SUMMARY"
          echo "- 组件：\`$COMPONENT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：\`$RELEASE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 产物：\`$PACKAGE_ASSET\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- 未创建 Tag、npm 包或 GitHub Release' >> "$GITHUB_STEP_SUMMARY"

  sync-registry:
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: ${{ needs.publish.outputs.npm_published == 'true' }}
    steps:
      - name: 同步 npmmirror
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
        run: curl --fail-with-body --retry 3 -X PUT "https://registry-direct.npmmirror.com/-/package/$PACKAGE_NAME/syncs"
