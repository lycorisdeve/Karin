name: release
on:
  push:
    branches:
      - main

# 赋予 release-please-action 权限
permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  # 设置 release-please 任务
  release-please:
    # 设置任务运行环境为 ubuntu-latest
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.release.outputs['packages/core--release_created'] }}
      cli: ${{ steps.release.outputs['packages/cli--release_created'] }}
      create-karin: ${{ steps.release.outputs['packages/create-karin--release_created'] }}
      web: ${{ steps.release.outputs['packages/web--release_created'] }}
      sandbox-win32-x64: ${{ steps.release.outputs['packages/sandbox-win32-x64--release_created'] }}
      sandbox-win32-arm64: ${{ steps.release.outputs['packages/sandbox-win32-arm64--release_created'] }}

    steps:
      # 使用 release-please-action 动作来自动创建发布 PR
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-sandbox:
    runs-on: windows-latest
    needs: release-please
    if: ${{ needs['release-please'].outputs['sandbox-win32-x64'] || needs['release-please'].outputs['sandbox-win32-arm64'] }}
    strategy:
      matrix:
        include:
          - package: sandbox-win32-x64
            target: x86_64-pc-windows-msvc
          - package: sandbox-win32-arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 构建 Windows Sandbox Helper
        working-directory: packages/${{ matrix.package }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 准备 Windows Sandbox Helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "packages/${{ matrix.package }}/bin"
          Copy-Item "packages/${{ matrix.package }}/target/${{ matrix.target }}/release/karin-sandbox.exe" "packages/${{ matrix.package }}/bin/karin-sandbox.exe"

      - name: Authenticode 签名
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE)) {
            throw '缺少 WINDOWS_SIGNING_CERTIFICATE，拒绝发布未签名 Sandbox Helper'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'karin-sandbox-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe 不可用' }
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_SIGNING_PASSWORD "packages/${{ matrix.package }}/bin/karin-sandbox.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Sandbox Helper Authenticode 签名失败' }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "packages/${{ matrix.package }}/bin/karin-sandbox.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "packages/${{ matrix.package }}/bin/karin-sandbox.exe.sha256" "$hash  karin-sandbox.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/bin

  publish:
    runs-on: ubuntu-latest
    needs: [release-please, build-sandbox]
    if: ${{ always() && (needs['release-please'].outputs.core || needs['release-please'].outputs.cli || needs['release-please'].outputs['create-karin'] || needs['release-please'].outputs['sandbox-win32-x64'] || needs['release-please'].outputs['sandbox-win32-arm64']) && (needs['build-sandbox'].result == 'success' || needs['build-sandbox'].result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: ${{ needs['build-sandbox'].result == 'success' }}
        with:
          pattern: sandbox-win32-*
          path: native-artifacts

      - name: 准备 Windows 平台包
        if: ${{ needs['build-sandbox'].result == 'success' }}
        run: |
          mkdir -p packages/sandbox-win32-x64/bin packages/sandbox-win32-arm64/bin
          cp native-artifacts/sandbox-win32-x64/* packages/sandbox-win32-x64/bin/
          cp native-artifacts/sandbox-win32-arm64/* packages/sandbox-win32-arm64/bin/

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: true

      - name: 构建
        run: pnpm build

      - name: 更新npm到最新
        run: npm install -g npm

      - name: 复制 README
        run: cp README.md packages/core

      - name: 发布 Windows x64 Sandbox 平台包
        if: ${{ needs['release-please'].outputs['sandbox-win32-x64'] }}
        working-directory: packages/sandbox-win32-x64
        run: npm publish --access public --provenance

      - name: 发布 Windows arm64 Sandbox 平台包
        if: ${{ needs['release-please'].outputs['sandbox-win32-arm64'] }}
        working-directory: packages/sandbox-win32-arm64
        run: npm publish --access public --provenance

      - name: 发布 core
        if: ${{ needs['release-please'].outputs.core }}
        working-directory: packages/core
        run: pnpm publish --no-git-checks

      - name: 发布 cli
        if: ${{ needs['release-please'].outputs.cli }}
        working-directory: packages/cli
        run: pnpm publish --no-git-checks

      - name: 发布 create-karin
        if: ${{ needs['release-please'].outputs['create-karin'] }}
        working-directory: packages/create-karin
        run: pnpm publish --no-git-checks

  syncn:
    runs-on: ubuntu-latest
    needs: [release-please, publish]
    steps:
      - name: 同步仓库状态
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: sync.yml
          repo: KarinJS/repo-status
          # Required when using the `repo` option. Either a PAT or a token generated from the GitHub app or CLI
          token: ${{ secrets.RELEASE }}

      # 同步所有包
      - name: 同步所有包
        run: |
          # 同步主包
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/node-karin/syncs"
          # 同步 cli 包
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/@karinjs/cli/syncs"
          # 同步 create-karin 包
          curl -X PUT "https://registry-direct.npmmirror.com/-/package/create-karin/syncs"

      # 当core包发布成功时触发Docker构建
      - name: 触发Docker构建
        if: ${{ needs['release-please'].outputs.core == 'true' }}
        uses: benc-uk/workflow-dispatch@v1
        with:
          repo: '${{ github.repository_owner }}/karin-docker'
          workflow: docker.yaml
          token: ${{ secrets.RELEASE }}
