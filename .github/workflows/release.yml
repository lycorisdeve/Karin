name: release
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 赋予 release-please-action 权限
permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  # 设置 release-please 任务
  release-please:
    # 设置任务运行环境为 ubuntu-latest
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.release.outputs['packages/core--release_created'] }}
      cli: ${{ steps.release.outputs['packages/cli--release_created'] }}
      create-karin: ${{ steps.release.outputs['packages/create-karin--release_created'] }}
      web: ${{ steps.release.outputs['packages/web--release_created'] }}
      sandbox-win32-x64: ${{ steps.release.outputs['packages/sandbox-win32-x64--release_created'] }}
      sandbox-win32-arm64: ${{ steps.release.outputs['packages/sandbox-win32-arm64--release_created'] }}
      core-tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
      cli-tag: ${{ steps.release.outputs['packages/cli--tag_name'] }}
      create-karin-tag: ${{ steps.release.outputs['packages/create-karin--tag_name'] }}
      web-tag: ${{ steps.release.outputs['packages/web--tag_name'] }}
      sandbox-win32-x64-tag: ${{ steps.release.outputs['packages/sandbox-win32-x64--tag_name'] }}
      sandbox-win32-arm64-tag: ${{ steps.release.outputs['packages/sandbox-win32-arm64--tag_name'] }}

    steps:
      - name: 检查 Release Please 凭据
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE }}
        run: test -n "$RELEASE_TOKEN" || { echo '缺少 RELEASE Secret，无法创建当前仓库的发布 PR'; exit 1; }

      # 使用 release-please-action 动作来自动创建发布 PR
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE }}
          repo-url: ${{ github.repository }}
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-sandbox:
    runs-on: windows-latest
    needs: release-please
    if: ${{ needs['release-please'].outputs['sandbox-win32-x64'] == 'true' || needs['release-please'].outputs['sandbox-win32-arm64'] == 'true' }}
    strategy:
      matrix:
        include:
          - package: sandbox-win32-x64
            target: x86_64-pc-windows-msvc
          - package: sandbox-win32-arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 构建 Windows Sandbox Helper
        working-directory: packages/${{ matrix.package }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 准备 Windows Sandbox Helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "packages/${{ matrix.package }}/bin"
          Copy-Item "packages/${{ matrix.package }}/target/${{ matrix.target }}/release/karin-sandbox.exe" "packages/${{ matrix.package }}/bin/karin-sandbox.exe"

      - name: Authenticode 签名
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE)) {
            throw '缺少 WINDOWS_SIGNING_CERTIFICATE，拒绝发布未签名 Sandbox Helper'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'karin-sandbox-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe 不可用' }
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_SIGNING_PASSWORD "packages/${{ matrix.package }}/bin/karin-sandbox.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Sandbox Helper Authenticode 签名失败' }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "packages/${{ matrix.package }}/bin/karin-sandbox.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "packages/${{ matrix.package }}/bin/karin-sandbox.exe.sha256" "$hash  karin-sandbox.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/bin
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release-please, build-sandbox]
    if: ${{ always() && (needs['release-please'].outputs.core == 'true' || needs['release-please'].outputs.cli == 'true' || needs['release-please'].outputs['create-karin'] == 'true' || needs['release-please'].outputs.web == 'true' || needs['release-please'].outputs['sandbox-win32-x64'] == 'true' || needs['release-please'].outputs['sandbox-win32-arm64'] == 'true') && (needs['build-sandbox'].result == 'success' || needs['build-sandbox'].result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: ${{ needs['build-sandbox'].result == 'success' }}
        with:
          pattern: sandbox-win32-*
          path: native-artifacts

      - name: 准备 Windows 平台包
        if: ${{ needs['build-sandbox'].result == 'success' }}
        run: |
          mkdir -p packages/sandbox-win32-x64/bin packages/sandbox-win32-arm64/bin
          cp native-artifacts/sandbox-win32-x64/* packages/sandbox-win32-x64/bin/
          cp native-artifacts/sandbox-win32-arm64/* packages/sandbox-win32-arm64/bin/

      - name: 上传 Windows x64 产物到当前仓库 Release
        if: ${{ needs['release-please'].outputs['sandbox-win32-x64'] == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs['release-please'].outputs['sandbox-win32-x64-tag'] }}" packages/sandbox-win32-x64/bin/* --clobber

      - name: 上传 Windows arm64 产物到当前仓库 Release
        if: ${{ needs['release-please'].outputs['sandbox-win32-arm64'] == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs['release-please'].outputs['sandbox-win32-arm64-tag'] }}" packages/sandbox-win32-arm64/bin/* --clobber

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: true

      - name: 构建
        run: pnpm build

      - name: 复制 README
        run: cp README.md packages/core

      - name: 解析待发布包的 workspace 依赖
        if: ${{ needs['release-please'].outputs.core == 'true' || needs['release-please'].outputs.cli == 'true' || needs['release-please'].outputs['create-karin'] == 'true' }}
        run: node scripts/prepare-npm-publish.mjs packages/core packages/cli packages/create-karin

      - name: 创建 Release 产物目录
        run: mkdir -p release-artifacts

      - name: 打包 core
        if: ${{ needs['release-please'].outputs.core == 'true' }}
        run: npm pack packages/core --pack-destination release-artifacts

      - name: 打包 cli
        if: ${{ needs['release-please'].outputs.cli == 'true' }}
        run: npm pack packages/cli --pack-destination release-artifacts

      - name: 打包 create-karin
        if: ${{ needs['release-please'].outputs['create-karin'] == 'true' }}
        run: npm pack packages/create-karin --pack-destination release-artifacts

      - name: 打包 Web UI
        if: ${{ needs['release-please'].outputs.web == 'true' }}
        run: |
          VERSION=$(node -p "require('./packages/web/package.json').version")
          tar -czf "release-artifacts/karin-webui-$VERSION.tgz" -C packages/core/dist/web .

      - name: 打包 Windows x64 Sandbox
        if: ${{ needs['release-please'].outputs['sandbox-win32-x64'] == 'true' }}
        run: npm pack packages/sandbox-win32-x64 --pack-destination release-artifacts

      - name: 打包 Windows arm64 Sandbox
        if: ${{ needs['release-please'].outputs['sandbox-win32-arm64'] == 'true' }}
        run: npm pack packages/sandbox-win32-arm64 --pack-destination release-artifacts

      - name: 上传 core 包到当前仓库 Release
        if: ${{ needs['release-please'].outputs.core == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs['release-please'].outputs['core-tag'] }}" release-artifacts/node-karin-*.tgz --clobber

      - name: 上传 cli 包到当前仓库 Release
        if: ${{ needs['release-please'].outputs.cli == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs['release-please'].outputs['cli-tag'] }}" release-artifacts/karinjs-cli-*.tgz --clobber

      - name: 上传 create-karin 包到当前仓库 Release
        if: ${{ needs['release-please'].outputs['create-karin'] == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs['release-please'].outputs['create-karin-tag'] }}" release-artifacts/create-karin-*.tgz --clobber

      - name: 上传 Web UI 到当前仓库 Release
        if: ${{ needs['release-please'].outputs.web == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs['release-please'].outputs['web-tag'] }}" release-artifacts/karin-webui-*.tgz --clobber

      - name: 上传 Windows x64 npm 包到当前仓库 Release
        if: ${{ needs['release-please'].outputs['sandbox-win32-x64'] == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs['release-please'].outputs['sandbox-win32-x64-tag'] }}" release-artifacts/karinjs-sandbox-win32-x64-*.tgz --clobber

      - name: 上传 Windows arm64 npm 包到当前仓库 Release
        if: ${{ needs['release-please'].outputs['sandbox-win32-arm64'] == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs['release-please'].outputs['sandbox-win32-arm64-tag'] }}" release-artifacts/karinjs-sandbox-win32-arm64-*.tgz --clobber

      - name: 检查 npm 凭据
        if: ${{ needs['release-please'].outputs.core == 'true' || needs['release-please'].outputs.cli == 'true' || needs['release-please'].outputs['create-karin'] == 'true' || needs['release-please'].outputs['sandbox-win32-x64'] == 'true' || needs['release-please'].outputs['sandbox-win32-arm64'] == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN" || { echo '缺少 NPM_TOKEN Secret，无法发布 npm 包'; exit 1; }

      - name: 计算 npm dist-tag
        id: npm-tags
        shell: bash
        run: |
          tag_for() {
            node -p "const v = require('./$1/package.json').version; v.includes('-') ? v.split('-')[1].split('.')[0] : 'latest'"
          }
          echo "core=$(tag_for packages/core)" >> "$GITHUB_OUTPUT"
          echo "cli=$(tag_for packages/cli)" >> "$GITHUB_OUTPUT"
          echo "create-karin=$(tag_for packages/create-karin)" >> "$GITHUB_OUTPUT"
          echo "sandbox-win32-x64=$(tag_for packages/sandbox-win32-x64)" >> "$GITHUB_OUTPUT"
          echo "sandbox-win32-arm64=$(tag_for packages/sandbox-win32-arm64)" >> "$GITHUB_OUTPUT"

      - name: 发布 Windows x64 Sandbox 平台包
        if: ${{ needs['release-please'].outputs['sandbox-win32-x64'] == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifacts/karinjs-sandbox-win32-x64-*.tgz --access public --provenance --tag "${{ steps['npm-tags'].outputs['sandbox-win32-x64'] }}"

      - name: 发布 Windows arm64 Sandbox 平台包
        if: ${{ needs['release-please'].outputs['sandbox-win32-arm64'] == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifacts/karinjs-sandbox-win32-arm64-*.tgz --access public --provenance --tag "${{ steps['npm-tags'].outputs['sandbox-win32-arm64'] }}"

      - name: 发布 core
        if: ${{ needs['release-please'].outputs.core == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifacts/node-karin-*.tgz --access public --provenance --tag "${{ steps['npm-tags'].outputs.core }}"

      - name: 发布 cli
        if: ${{ needs['release-please'].outputs.cli == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifacts/karinjs-cli-*.tgz --access public --provenance --tag "${{ steps['npm-tags'].outputs.cli }}"

      - name: 发布 create-karin
        if: ${{ needs['release-please'].outputs['create-karin'] == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifacts/create-karin-*.tgz --access public --provenance --tag "${{ steps['npm-tags'].outputs['create-karin'] }}"

  sync-registry:
    runs-on: ubuntu-latest
    needs: [release-please, publish]
    steps:
      - name: 同步 core 镜像
        if: ${{ needs['release-please'].outputs.core == 'true' }}
        run: curl --fail-with-body --retry 3 -X PUT "https://registry-direct.npmmirror.com/-/package/node-karin/syncs"

      - name: 同步 cli 镜像
        if: ${{ needs['release-please'].outputs.cli == 'true' }}
        run: curl --fail-with-body --retry 3 -X PUT "https://registry-direct.npmmirror.com/-/package/@karinjs/cli/syncs"

      - name: 同步 create-karin 镜像
        if: ${{ needs['release-please'].outputs['create-karin'] == 'true' }}
        run: curl --fail-with-body --retry 3 -X PUT "https://registry-direct.npmmirror.com/-/package/create-karin/syncs"

      - name: 同步 Windows x64 Sandbox 镜像
        if: ${{ needs['release-please'].outputs['sandbox-win32-x64'] == 'true' }}
        run: curl --fail-with-body --retry 3 -X PUT "https://registry-direct.npmmirror.com/-/package/@karinjs/sandbox-win32-x64/syncs"

      - name: 同步 Windows arm64 Sandbox 镜像
        if: ${{ needs['release-please'].outputs['sandbox-win32-arm64'] == 'true' }}
        run: curl --fail-with-body --retry 3 -X PUT "https://registry-direct.npmmirror.com/-/package/@karinjs/sandbox-win32-arm64/syncs"
