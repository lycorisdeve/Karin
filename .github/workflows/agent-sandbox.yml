name: agent-sandbox

on:
  pull_request:
    paths:
      - 'packages/core/src/agent/execution/**'
      - 'packages/sandbox-win32-*/**'
      - '.github/workflows/agent-sandbox.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core/src/agent/execution/**'
      - 'packages/sandbox-win32-*/**'

permissions:
  contents: read

jobs:
  native-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sandbox-win32-x64
            target: x86_64-pc-windows-msvc
          - package: sandbox-win32-arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build helper
        working-directory: packages/${{ matrix.package }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "packages/${{ matrix.package }}/bin"
          Copy-Item "packages/${{ matrix.package }}/target/${{ matrix.target }}/release/karin-sandbox.exe" "packages/${{ matrix.package }}/bin/karin-sandbox.exe"
          $hash = (Get-FileHash "packages/${{ matrix.package }}/bin/karin-sandbox.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "packages/${{ matrix.package }}/bin/karin-sandbox.exe.sha256" "$hash  karin-sandbox.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/bin

  platform-integration:
    needs: native-helper
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: true
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: sandbox-win32-x64
          path: packages/sandbox-win32-x64/bin
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pnpm exec vitest run tests/agent/sandbox.test.ts
        env:
          KARIN_SANDBOX_INTEGRATION: '1'
