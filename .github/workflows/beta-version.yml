name: beta-version

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

jobs:
  publish-temp:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史记录，用于生成版本号

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: true

      - name: 获取当前提交哈希
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> $GITHUB_ENV
          echo "REPO_URL=https://github.com/${{ github.repository }}/tree/$COMMIT_HASH" >> $GITHUB_ENV

      - name: 编译
        run: pnpm build
        id: build
        continue-on-error: true

      - name: 检查构建结果
        if: steps.build.outcome != 'success'
        run: |
          echo "❌ 构建失败！" >> $GITHUB_STEP_SUMMARY
          echo "提交哈希: ${{ env.SHORT_COMMIT_HASH }}" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: 打包临时 npm 包
        run: |
          cp README.md packages/core
          node scripts/prepare-npm-publish.mjs packages/core
          mkdir -p preview-packages
          npm pack ./packages/core --pack-destination preview-packages

      - name: 生成发布摘要
        run: |
          echo "## Preview package :package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "提交: [${{ env.SHORT_COMMIT_HASH }}](${{ env.REPO_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "下载本次运行的 \`node-karin-preview-${{ env.SHORT_COMMIT_HASH }}\` artifact 后安装其中的 tgz 文件。" >> $GITHUB_STEP_SUMMARY

      - name: 上传临时 npm 包
        uses: actions/upload-artifact@v4
        with:
          name: node-karin-preview-${{ env.SHORT_COMMIT_HASH }}
          path: preview-packages/*.tgz
          if-no-files-found: error
