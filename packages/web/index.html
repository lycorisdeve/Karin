<!doctype html>
<html lang="zh"></html>

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/karin.png" />
  <link rel="stylesheet" href="/icon.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karin WebUI</title>
  <meta key="title" content="Vite + NextUI" property="og:title" />
  <meta content="Make beautiful websites regardless of your design experience." property="og:description" />
  <meta content="Make beautiful websites regardless of your design experience." name="description" />
  <meta key="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    name="viewport" />
  <link href="/favicon.ico" rel="icon" />
  <script>
    try {
      const cached = JSON.parse(localStorage.getItem('karin-webui-appearance') || 'null')
      const theme = cached?.themes?.find(item => item.id === cached.activeThemeId)
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      const resolved = cached?.mode === 'dark' || (cached?.mode === 'system' && systemDark)
        ? 'dark'
        : 'light'
      document.documentElement.classList.add(resolved)
      document.documentElement.dataset.skin = theme?.skin || 'bloom'
      document.documentElement.dataset.themeId = theme?.id || 'karin-bloom'
      document.documentElement.dataset.density = theme?.density || 'comfortable'
    } catch {
      document.documentElement.classList.add('light')
      document.documentElement.dataset.skin = 'bloom'
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
